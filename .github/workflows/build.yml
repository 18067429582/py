name: Build Gold Price App

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pyinstaller

      - name: Build Executable
        shell: bash
        run: |
          # 自动寻找当前目录下所有的 .py 文件进行打包，防止名字写错
          for f in *.py; do pyinstaller -F -w "$f"; done

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: GoldPrice-${{ matrix.os }}
          path: dist/*
